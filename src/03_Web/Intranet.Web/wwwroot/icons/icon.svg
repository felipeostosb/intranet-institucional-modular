<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="aquilaWingLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="aquilaWingRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="aquilaCore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>
  </defs>

  <g id="aquila-stealth-wings" stroke-linejoin="round" stroke-linecap="round">
    <!-- Ala Izquierda Afilada (Stealth Delta Wing) -->
    <polygon points="48,10 4,68 32,60 46,38" fill="url(#aquilaWingLeft)" />
    
    <!-- Ala Derecha Afilada (Stealth Delta Wing) -->
    <polygon points="52,10 96,68 68,60 54,38" fill="url(#aquilaWingRight)" />
    
    <!-- Pico / Fuselaje Central Supersónico Afilado -->
    <polygon points="50,6 43,44 50,88 57,44" fill="url(#aquilaCore)" />
    <!-- Acento Interior Aerodinámico -->
    <polygon points="50,22 46,44 50,70 54,44" fill="#0284c7" />
  </g>
</svg>