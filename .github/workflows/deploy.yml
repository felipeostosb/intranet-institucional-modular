name: CI/CD Pipeline - Despliegue en mili3

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 1. Checkout del Repositorio
        uses: actions/checkout@v4

      - name: 2. Login en GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 3. Construir y Publicar Imagen Docker en la Nube
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: 4. Despliegue Automático en mili3 vía SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.MILI3_HOST }}
          username: fob
          key: ${{ secrets.MILI3_SSH_KEY }}
          script: |
            cd /home/fob/services/app-net
            # Registrar el SHA desplegado (trazabilidad: latest siempre identificable)
            echo "${{ github.sha }}" > .deployed-sha
            docker compose pull app
            docker compose up -d app
            echo ">>> DESPLIEGUE EXITOSO EN MILI3 (commit ${{ github.sha }}) <<<"
            echo ">>> Rollback: docker tag ghcr.io/${{ github.repository }}:<sha-anterior> ghcr.io/${{ github.repository }}:latest && docker compose up -d app <<<"

      - name: 5. Health Check post-despliegue
        run: |
          echo "🔍 Verificando salud de la app en producción..."
          HEALTH_URL="http://${{ secrets.MILI3_HOST }}:5000/Account/Login"
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$HEALTH_URL" || true)
            if [ "$CODE" = "200" ]; then
              echo "✅ App respondiendo (intento ${i}/30, HTTP $CODE)"
              exit 0
            fi
            echo "⏳ Esperando... (intento ${i}/30, HTTP $CODE)"
            sleep 10
          done
          echo "⛔ La app NO respondió tras 30 intentos (5 min). Posible crash post-arranque."
          echo "   Revisar: ssh fob@${{ secrets.MILI3_HOST }} 'docker logs app-net-app-1 --tail 50'"
          exit 1
